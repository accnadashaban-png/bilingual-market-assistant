name: Bug report
description: Something answered wrongly or broke
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Question asked (exact text)
    validations:
      required: true
  - type: textarea
    attributes:
      label: What the assistant answered, and what you expected
    validations:
      required: true
  - type: input
    attributes:
      label: Mode (offline / LLM provider) and database (SQLite / PostgreSQL)
