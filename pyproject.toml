[project]
name = "bilingual-market-assistant"
version = "3.3.0"
description = "Conversational Arabic + English market-data assistant: LangGraph pipeline, LLM provider failover, typed tools, safe text-to-SQL on SQLite or PostgreSQL, MCP server, streaming widget and a 536-case evaluation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nada Shaban" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlglot>=25",
    "langgraph>=0.2",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["market_assistant*"]

[tool.setuptools.package-data]
"market_assistant.eval" = ["datasets/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "market_assistant.agent.pipeline"
# LangGraph's add_node overloads don't accept plain bound methods in mypy, although they work at runtime
disable_error_code = ["call-overload", "arg-type"]
